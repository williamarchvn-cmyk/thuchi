<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#F2F3F5">
<title>Sổ Thu Chi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ================= TOKENS ================= */
:root{
  --font:'Be Vietnam Pro',system-ui,-apple-system,sans-serif;
  --bg:#F2F3F5; --surface:#FFFFFF; --field:#F2F3F5; --field-focus:#FFFFFF; --border:#E2E4E9;
  --ink:#111827; --ink-2:#374151; --muted:#6B7280;
  --thu:#2563EB; --thu-ink:#1D4ED8; --thu-soft:#E6EEFC; --thu-border:#C9D9F8;
  --chi:#B4233F; --chi-ink:#9C1C35; --chi-soft:#F8E7EA; --chi-border:#EDC6CE;
  --primary:#111827; --primary-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(17,24,39,.05),0 2px 6px rgba(17,24,39,.05);
  --card-shadow:0 1px 2px rgba(17,24,39,.06),0 6px 14px -6px rgba(17,24,39,.14);
  --scrim:rgba(17,24,39,.4);
  --toast:#111827; --toast-ink:#FFFFFF;
  --ease:cubic-bezier(.2,.8,.2,1);
  --spring:linear(0,.009,.035 2.1%,.141,.281 6.7%,.723 12.9%,.938 16.7%,1.017,1.077,1.121,1.149 24.3%,1.159,1.163,1.161,1.154 29.9%,1.129 32.8%,1.051 39.6%,1.017 43.1%,.991,.977 51%,.974 53.8%,.975 57.1%,.997 69.8%,1.003 76.9%,1.004 83.8%,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --bg:#0F1115; --surface:#191C22; --field:#23272F; --field-focus:#2A2F38; --border:#2A2E37;
    --ink:#F3F4F6; --ink-2:#D1D5DB; --muted:#9CA3AF;
    --thu:#4C8DFF; --thu-ink:#8AB4FF; --thu-soft:#14213A; --thu-border:#22375E;
    --chi:#E25570; --chi-ink:#F58FA2; --chi-soft:#2A161D; --chi-border:#4A2330;
    --primary:#F3F4F6; --primary-ink:#111827;
    --shadow:0 1px 2px rgba(0,0,0,.4); --card-shadow:0 1px 2px rgba(0,0,0,.4),0 6px 14px -6px rgba(0,0,0,.6);
    --scrim:rgba(0,0,0,.6); --toast:#F3F4F6; --toast-ink:#111827;
    color-scheme:dark;
  }
}
:root[data-theme=dark]{
  --bg:#0F1115; --surface:#191C22; --field:#23272F; --field-focus:#2A2F38; --border:#2A2E37;
  --ink:#F3F4F6; --ink-2:#D1D5DB; --muted:#9CA3AF;
  --thu:#4C8DFF; --thu-ink:#8AB4FF; --thu-soft:#14213A; --thu-border:#22375E;
  --chi:#E25570; --chi-ink:#F58FA2; --chi-soft:#2A161D; --chi-border:#4A2330;
  --primary:#F3F4F6; --primary-ink:#111827;
  --shadow:0 1px 2px rgba(0,0,0,.4); --card-shadow:0 1px 2px rgba(0,0,0,.4),0 6px 14px -6px rgba(0,0,0,.6);
  --scrim:rgba(0,0,0,.6); --toast:#F3F4F6; --toast-ink:#111827;
  color-scheme:dark;
}

/* ================= BASE ================= */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg)}
body{font-family:var(--font);color:var(--ink);overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--thu);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* Bề mặt phẳng: màu đặc + viền mảnh + bóng nhẹ */
.lg{background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow)}

.app{position:relative;height:100dvh;max-width:480px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);gap:10px;
  padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 12px)}

/* ================= KHU 1: DASHBOARD ================= */
.top{display:flex;flex-direction:column;gap:8px}
.appbar{display:flex;align-items:center;justify-content:space-between;padding:0 4px;min-height:40px}
.brand b{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.brand small{font-size:12px;color:var(--muted);font-weight:500;text-transform:capitalize}
.tools{display:flex;gap:6px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);transition:transform .35s var(--spring),background .2s}
.icon-btn svg{width:18px;height:18px}
.icon-btn:active{transform:scale(.88);background:var(--field)}

.bento{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.tile{border-radius:20px;padding:12px 14px;min-width:0}
.t-bal{grid-column:span 4;display:flex;flex-direction:column}
.t-ring{grid-column:span 2;display:grid;place-items:center;padding:10px}
.t-in,.t-out{grid-column:span 3;display:flex;align-items:center;gap:10px;padding:10px 12px}
.t-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;color:var(--muted)}
.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--field);color:var(--ink-2)}
.balance{margin-top:2px;font-size:30px;font-weight:800;letter-spacing:-.035em;line-height:1.15;white-space:nowrap;transition:color .3s}
.balance.long{font-size:24px}
.balance small{font-size:15px;font-weight:600;color:var(--muted);margin-left:3px;letter-spacing:0}
.balance.neg{color:var(--chi-ink)}
.spark{display:block;width:100%;height:30px;margin-top:auto;color:var(--thu);overflow:visible;transition:color .3s}
.spark.neg{color:var(--chi)}
.spark #spArea{fill:currentColor;fill-opacity:.1}
.spark path{transition:d .5s var(--ease)}
.ring{position:relative;width:84px;height:84px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11;stroke-linecap:butt}
.ring .track{stroke:var(--field)}
.ring #arcThu{stroke:var(--thu)} .ring #arcChi{stroke:var(--chi)}
.ring .arc{transition:stroke-dasharray .7s var(--ease),stroke-dashoffset .7s var(--ease)}
.r-center{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.1}
.r-center b{font-size:17px;font-weight:800;letter-spacing:-.03em}
.r-center small{font-size:9.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.r-center.neg b{color:var(--chi-ink)}
.ic{width:32px;height:32px;flex:none;border-radius:10px;display:grid;place-items:center;color:#fff}
.ic svg{width:16px;height:16px}
.ic.thu{background:var(--thu)} .ic.chi{background:var(--chi)}
.t-txt{min-width:0;flex:1}
.t-txt small{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;font-weight:600;color:var(--muted)}
.t-txt small em{font-style:normal;font-weight:500}
.t-txt b{display:block;font-size:17px;font-weight:750;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-in b{color:var(--thu-ink)} .t-out b{color:var(--chi-ink)}

/* ================= KHU 2: NHẬP ================= */
.entry-wrap{display:flex;flex-direction:column}
.entry{display:flex;align-items:center;gap:6px;height:58px;padding:6px 6px 6px 16px;border-radius:20px;transition:border-color .2s,box-shadow .2s}
.entry-wrap:focus-within .entry{border-color:var(--thu);box-shadow:0 0 0 3px color-mix(in srgb,var(--thu) 18%,transparent)}
.entry input{min-width:0;height:100%;border:0;background:none;outline:none;font:inherit;color:var(--ink);font-size:16px}
.entry input::placeholder{color:var(--muted)}
.f-amt{display:flex;align-items:center;flex:1 1 0;min-width:0}
.f-amt input{flex:1;font-weight:750;font-size:18px;letter-spacing:-.02em;width:0}
.f-amt span{font-weight:600;color:var(--muted);font-size:14px}
.divider{width:1px;height:24px;background:var(--border);flex:none;margin:0 4px}
.f-note{flex:1.2 1 0;width:0}
.add{height:46px;min-width:52px;padding:0 10px;flex:none;border:0;border-radius:14px;color:#fff;font-weight:700;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:3px;transition:transform .35s var(--spring),filter .2s}
.add svg{width:14px;height:14px}
.add:active{transform:scale(.9);filter:brightness(.92)}
.add.thu{background:var(--thu)} .add.chi{background:var(--chi)}
.chips{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease),opacity .25s;opacity:0}
.entry-wrap:focus-within .chips{grid-template-rows:1fr;opacity:1}
.chips>div{overflow:hidden;display:flex;gap:6px;padding:0 2px}
.entry-wrap:focus-within .chips>div{padding-top:8px}
.chip{flex:1;height:34px;border-radius:10px;font-size:13px;font-weight:650;color:var(--ink-2);transition:transform .3s var(--spring),background .2s}
.chip:active{transform:scale(.92);background:var(--field)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* ================= KHU 3 & 4 ================= */
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;min-height:0}
.zone{display:flex;flex-direction:column;min-height:0;border-radius:22px;overflow:hidden;box-shadow:none;transition:box-shadow .25s var(--ease),border-color .25s}
.zone.thu{background:var(--thu-soft);border-color:var(--thu-border)}
.zone.chi{background:var(--chi-soft);border-color:var(--chi-border)}
.zone.thu.over{border-color:var(--thu);box-shadow:0 0 0 3px color-mix(in srgb,var(--thu) 25%,transparent)}
.zone.chi.over{border-color:var(--chi);box-shadow:0 0 0 3px color-mix(in srgb,var(--chi) 25%,transparent)}
.zone header{display:flex;align-items:center;justify-content:space-between;padding:13px 12px 6px 14px}
.ztitle{display:flex;align-items:center;gap:7px;font-weight:750;font-size:14.5px;letter-spacing:-.01em}
.ztitle i{width:8px;height:8px;border-radius:50%}
.zone.thu .ztitle{color:var(--thu-ink)} .zone.thu .ztitle i{background:var(--thu)}
.zone.chi .ztitle{color:var(--chi-ink)} .zone.chi .ztitle i{background:var(--chi)}
.badge{min-width:26px;text-align:center;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface);color:var(--ink-2)}
.list{position:relative;flex:1;overflow-y:auto;overscroll-behavior:contain;padding:6px 9px 14px;display:flex;flex-direction:column;gap:8px;scrollbar-width:none}
.list::-webkit-scrollbar{display:none}

/* Thẻ */
.card{flex:none;position:relative;padding:11px 12px 10px;border-radius:16px;background:var(--surface);border:1px solid var(--border);
  border-left:3px solid var(--cs);box-shadow:var(--card-shadow);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y;cursor:grab;
  transition:transform .35s var(--spring)}
.card[data-t=thu]{--cs:var(--thu)} .card[data-t=chi]{--cs:var(--chi)}
.card.pressing{transform:scale(.95)}
.c-amt{font-size:20px;font-weight:800;letter-spacing:-.03em;line-height:1.15;white-space:nowrap}
.c-amt.sm{font-size:16px}
.c-amt .sign{margin-right:1px;font-weight:700}
.c-amt small{font-size:12px;font-weight:600;color:var(--muted);margin-left:2px;letter-spacing:0}
.card[data-t=thu] .c-amt{color:var(--thu-ink)} .card[data-t=chi] .c-amt{color:var(--chi-ink)}
.c-note{font-size:13px;font-weight:500;color:var(--ink-2);margin-top:3px;line-height:1.32;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.c-time{font-size:10.5px;font-weight:500;color:var(--muted);margin-top:6px}
.card.enter{animation:enter .6s var(--spring)}
@keyframes enter{from{opacity:0;transform:translateY(-14px) scale(.88)}}
.card.settle{animation:settle .5s var(--spring)}
@keyframes settle{from{transform:scale(1.05)}}
.ghost{position:fixed;left:0;top:0;margin:0;z-index:60;pointer-events:none;will-change:transform;scale:1.05;rotate:2deg;
  box-shadow:0 20px 36px -14px rgba(17,24,39,.4);animation:lift .35s var(--spring)}
@keyframes lift{from{scale:1;rotate:0deg}}
.ph{flex:none;border-radius:16px;border:2px dashed color-mix(in srgb,var(--muted) 45%,transparent);background:color-mix(in srgb,var(--surface) 50%,transparent)}
.empty{margin:auto;text-align:center;color:var(--muted);font-size:12.5px;font-weight:600;padding:18px 8px;line-height:1.5}
.empty .e-ic{width:44px;height:44px;margin:0 auto 10px;border-radius:14px;display:grid;place-items:center;background:var(--surface);color:var(--ink-2)}
.empty .e-ic svg{width:20px;height:20px}
.empty span{display:block;font-size:11px;font-weight:400}
.list:has(.ph) .empty{display:none}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none!important}

/* ================= QUẲNG ĐỂ XÓA ================= */
.trash-hint{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);z-index:70;transform:translate(-50%,-160%);display:flex;align-items:center;gap:8px;
  padding:10px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--card-shadow);font-size:13.5px;font-weight:650;color:var(--ink-2);
  white-space:nowrap;pointer-events:none;transition:transform .45s var(--spring),background .2s,color .2s,border-color .2s}
.trash-hint svg{width:18px;height:18px;flex:none}
body.dragging .trash-hint{transform:translate(-50%,0)}
body.dragging .trash-hint.active{background:var(--chi);border-color:var(--chi);color:#fff;transform:translate(-50%,0) scale(1.08)}
.ghost{transition:scale .2s var(--ease),rotate .2s var(--ease),box-shadow .2s,border-color .2s}
.ghost.out{border-color:var(--chi);box-shadow:0 0 0 2px var(--chi),0 20px 36px -14px rgba(180,35,63,.5);scale:.94;rotate:-4deg}

/* ================= SHEET ================= */
.sheet-wrap{position:fixed;inset:0;z-index:80;pointer-events:none}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .3s}
.sheet{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:460px;margin:0 auto;padding:10px 16px 16px;border-radius:26px;
  transform:translateY(calc(100% + 40px));transition:transform .45s cubic-bezier(.2,.9,.22,1)}
.sheet-wrap.open{pointer-events:auto}.sheet-wrap.open .scrim{opacity:1}.sheet-wrap.open .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:99px;background:var(--border);margin:0 auto 12px}
.sheet h3{margin:0 2px;font-size:18px;font-weight:750;letter-spacing:-.02em}
.sheet label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:14px 2px 6px}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:14px;background:var(--field);margin-top:12px}
.seg button{position:relative;z-index:1;height:40px;border:0;background:none;font-weight:700;color:var(--muted);transition:color .3s}
.seg .knob{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:10px;transition:transform .5s var(--spring),background .3s}
.seg[data-v=thu] .knob{background:var(--thu)}
.seg[data-v=chi] .knob{transform:translateX(100%);background:var(--chi)}
.seg[data-v=thu] [data-t=thu],.seg[data-v=chi] [data-t=chi]{color:#fff}
.s-field{display:flex;align-items:center;border-radius:14px;background:var(--field);border:1px solid transparent;padding:0 14px;transition:background .2s,border-color .2s,box-shadow .2s}
.s-field:focus-within{background:var(--field-focus);border-color:var(--thu);box-shadow:0 0 0 3px color-mix(in srgb,var(--thu) 18%,transparent)}
.s-field input{flex:1;min-width:0;height:50px;border:0;background:none;outline:none;font:inherit;font-size:16px;color:var(--ink)}
.s-field.big input{font-size:26px;font-weight:800;letter-spacing:-.03em;height:60px}
.s-field span{font-weight:600;color:var(--muted)}
.btn-row{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:18px}
.btn{height:52px;border-radius:15px;border:0;font-weight:700;font-size:15px;transition:transform .35s var(--spring)}
.btn:active{transform:scale(.95)}
.btn.primary{background:var(--primary);color:var(--primary-ink)}
.btn.danger{background:var(--chi-soft);color:var(--chi-ink)}
.menu-item{display:flex;align-items:center;gap:12px;width:100%;padding:15px 14px;margin-top:8px;border:0;border-radius:15px;background:var(--field);font-weight:600;font-size:15px;color:var(--ink);text-align:left;transition:transform .3s var(--spring)}
.menu-item:active{transform:scale(.97)}
.menu-item.danger{color:var(--chi-ink)}
.menu-item svg{width:20px;height:20px;flex:none}

/* ================= TOAST ================= */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));z-index:90;transform:translate(-50%,28px) scale(.96);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:12px;padding:11px 18px;border-radius:999px;background:var(--toast);color:var(--toast-ink);font-size:13.5px;font-weight:600;white-space:nowrap;
  box-shadow:0 12px 26px -12px rgba(17,24,39,.5);transition:opacity .25s,transform .5s var(--spring)}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
.toast.has-act{padding-right:8px}
.toast button{border:0;background:color-mix(in srgb,var(--toast-ink) 16%,transparent);color:var(--toast-ink);border-radius:999px;padding:7px 13px;font-weight:700;font-size:13px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<main class="app">
  <!-- KHU 1: DASHBOARD -->
  <section class="top">
    <div class="appbar">
      <div class="brand"><b>Sổ thu chi</b><small id="today"></small></div>
      <div class="tools">
        <button class="icon-btn lg" id="eyeBtn" aria-label="Ẩn/hiện số tiền"></button>
        <button class="icon-btn lg" id="themeBtn" aria-label="Đổi giao diện sáng/tối"></button>
        <button class="icon-btn lg" id="menuBtn" aria-label="Tùy chọn">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
        </button>
      </div>
    </div>
    <div class="bento">
      <div class="tile t-bal lg">
        <div class="t-head"><span>Số dư</span><span class="pill" id="txCount">0 giao dịch</span></div>
        <div class="balance num" id="balWrap"><span id="bal">0</span><small>₫</small></div>
        <svg class="spark" id="spark" viewBox="0 0 200 34" preserveAspectRatio="none" aria-hidden="true">
          <path id="spArea" d="M0 34 L200 34 Z"/>
          <path id="spLine" fill="none" stroke="currentColor" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round" d="M0 31 L200 31"/>
        </svg>
      </div>
      <div class="tile t-ring lg">
        <div class="ring">
          <svg viewBox="0 0 100 100">
            <circle class="track" cx="50" cy="50" r="40"/>
            <circle class="arc" id="arcChi" cx="50" cy="50" r="40" stroke-dasharray="0 252"/>
            <circle class="arc" id="arcThu" cx="50" cy="50" r="40" stroke-dasharray="0 252"/>
          </svg>
          <div class="r-center" id="rCenter"><b class="num" id="pct">0%</b><small id="pctLbl">tiết kiệm</small></div>
        </div>
      </div>
      <div class="tile t-in lg">
        <span class="ic thu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7 7 17M7 8v9h9"/></svg></span>
        <div class="t-txt"><small><span>Tổng thu</span><em id="nThu">0 khoản</em></small><b class="num" id="sumThu">0</b></div>
      </div>
      <div class="tile t-out lg">
        <span class="ic chi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg></span>
        <div class="t-txt"><small><span>Tổng chi</span><em id="nChi">0 khoản</em></small><b class="num" id="sumChi">0</b></div>
      </div>
    </div>
  </section>

  <!-- KHU 2: NHẬP DỮ LIỆU -->
  <div class="entry-wrap" id="entryWrap">
    <form class="entry lg" autocomplete="off" onsubmit="return false">
      <label class="f-amt"><input id="amt" class="num" inputmode="numeric" placeholder="0" enterkeyhint="next" aria-label="Số tiền"><span>₫</span></label>
      <span class="divider"></span>
      <input id="note" class="f-note" placeholder="Nội dung" maxlength="60" enterkeyhint="done" aria-label="Nội dung">
      <button type="button" class="add thu" data-type="thu" aria-label="Thêm khoản thu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Thu</button>
      <button type="button" class="add chi" data-type="chi" aria-label="Thêm khoản chi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Chi</button>
    </form>
    <div class="chips" id="chips"><div>
      <button type="button" class="chip lg" data-q="000">000</button>
      <button type="button" class="chip lg" data-q="10000">+10K</button>
      <button type="button" class="chip lg" data-q="50000">+50K</button>
      <button type="button" class="chip lg" data-q="100000">+100K</button>
      <button type="button" class="chip lg" data-q="500000">+500K</button>
      <button type="button" class="chip lg" data-q="c" aria-label="Xóa số tiền">⌫</button>
    </div></div>
  </div>

  <!-- KHU 3 & 4 -->
  <div class="cols" id="cols">
    <section class="zone thu lg" data-zone="thu">
      <header><div class="ztitle"><i></i>Thu</div><span class="badge num" id="cnt-thu">0</span></header>
      <div class="list" data-list="thu"></div>
    </section>
    <section class="zone chi lg" data-zone="chi">
      <header><div class="ztitle"><i></i>Chi</div><span class="badge num" id="cnt-chi">0</span></header>
      <div class="list" data-list="chi"></div>
    </section>
  </div>
</main>

<!-- Sheet sửa thẻ -->
<div class="sheet-wrap" id="editSheet" aria-hidden="true">
  <div class="scrim"></div>
  <div class="sheet lg" role="dialog" aria-label="Sửa khoản">
    <div class="grab"></div>
    <h3>Sửa khoản</h3>
    <div class="seg" id="seg" data-v="thu"><i class="knob"></i><button type="button" data-t="thu">Thu</button><button type="button" data-t="chi">Chi</button></div>
    <label for="eAmt">Số tiền</label>
    <div class="s-field big"><input id="eAmt" class="num" inputmode="numeric" autocomplete="off"><span>₫</span></div>
    <label for="eNote">Nội dung</label>
    <div class="s-field"><input id="eNote" maxlength="60" autocomplete="off" enterkeyhint="done"></div>
    <div class="btn-row"><button class="btn danger" id="eDel">Xóa</button><button class="btn primary" id="eSave">Lưu thay đổi</button></div>
  </div>
</div>

<!-- Sheet menu -->
<div class="sheet-wrap" id="menuSheet" aria-hidden="true">
  <div class="scrim"></div>
  <div class="sheet lg" role="dialog" aria-label="Tùy chọn">
    <div class="grab"></div>
    <h3>Tùy chọn</h3>
    <button class="menu-item" id="mExport"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg>Xuất file CSV</button>
    <button class="menu-item danger" id="mClear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Xóa toàn bộ dữ liệu</button>
  </div>
</div>

<div class="trash-hint" id="trashHint" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg><span id="trashText">Quẳng ra ngoài để xóa</span></div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const KEY = 'thuchi.v1', SEEN = 'thuchi.seen2', THEME = 'thuchi.theme', HIDE = 'thuchi.hide';
  const store = {
    get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
    set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
  };
  const fmt = n => Math.round(n).toLocaleString('vi-VN');
  const parseMoney = s => parseInt(String(s).replace(/\D/g,''),10) || 0;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  const pad = n => String(n).padStart(2,'0');
  const timeStr = ts => { const d = new Date(ts); return `${pad(d.getDate())}/${pad(d.getMonth()+1)} · ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch(e){} };
  const MASK = '••••••';
  let hidden = store.get(HIDE) === '1';
  const compact = n => {
    const a = Math.abs(n), s = n < 0 ? '−' : '';
    if (a >= 1e9) return s + (a/1e9).toLocaleString('vi-VN',{maximumFractionDigits:2}) + ' tỷ';
    if (a >= 1e8) return s + (a/1e6).toLocaleString('vi-VN',{maximumFractionDigits:1}) + ' tr';
    return s + fmt(a);
  };

  /* ---------- Dữ liệu ---------- */
  let items = null;
  try { items = JSON.parse(store.get(KEY)); } catch(e){}
  if (!Array.isArray(items)) {
    const t = Date.now(), h = 36e5;
    items = [
      {id:uid(), type:'thu', amount:15000000, note:'Lương tháng 11', ts:t-30*h},
      {id:uid(), type:'thu', amount:2500000,  note:'Thưởng dự án', ts:t-50*h},
      {id:uid(), type:'chi', amount:3200000,  note:'Tiền thuê nhà', ts:t-20*h},
      {id:uid(), type:'chi', amount:850000,   note:'Đi chợ cuối tuần', ts:t-6*h},
      {id:uid(), type:'chi', amount:460000,   note:'Điện nước', ts:t-3*h}
    ];
    save();
  }
  function save(){ store.set(KEY, JSON.stringify(items)); }

  const lists = { thu: $('[data-list=thu]'), chi: $('[data-list=chi]') };
  const arcThu = $('#arcThu'), arcChi = $('#arcChi');
  $('#today').textContent = new Date().toLocaleDateString('vi-VN',{weekday:'long', day:'2-digit', month:'2-digit'});

  /* ---------- Giao diện sáng / tối ---------- */
  const ICONS = {
    auto:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg>',
    light:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    dark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20.5 13.2A8.5 8.5 0 1 1 10.8 3.5a6.6 6.6 0 0 0 9.7 9.7z"/></svg>',
    eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
    eyeOff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.6A17 17 0 0 0 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>'
  };
  const THEME_NAMES = {auto:'Tự động', light:'Sáng', dark:'Tối'};
  let theme = store.get(THEME) || 'auto';
  const mq = matchMedia('(prefers-color-scheme: dark)');
  function applyTheme(){
    const root = document.documentElement;
    if (theme === 'auto') delete root.dataset.theme; else root.dataset.theme = theme;
    $('#themeBtn').innerHTML = ICONS[theme];
    const dark = theme === 'dark' || (theme === 'auto' && mq.matches);
    document.querySelector('meta[name=theme-color]').content = dark ? '#0F1115' : '#F2F3F5';
  }
  mq.addEventListener && mq.addEventListener('change', applyTheme);
  $('#themeBtn').addEventListener('click', () => {
    theme = {auto:'light', light:'dark', dark:'auto'}[theme];
    store.set(THEME, theme); applyTheme(); toast('Giao diện: ' + THEME_NAMES[theme]);
  });
  function applyEye(){ $('#eyeBtn').innerHTML = hidden ? ICONS.eyeOff : ICONS.eye; }
  $('#eyeBtn').addEventListener('click', () => {
    hidden = !hidden; store.set(HIDE, hidden ? '1' : '0'); applyEye(); render({noFlip:true});
  });
  applyTheme(); applyEye();

  /* ---------- Render ---------- */
  function cardHTML(it){
    const s = fmt(it.amount);
    const amt = hidden ? MASK : s;
    return `<div class="card" data-id="${it.id}" data-t="${it.type}">
      <div class="c-amt num${!hidden && s.length > 10 ? ' sm' : ''}"><span class="sign">${it.type==='thu'?'+':'−'}</span>${amt}<small>₫</small></div>
      <div class="c-note">${esc(it.note)}</div></div>`;
  }
  const EMPTY_IC = {
    thu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h15a3 3 0 0 1 3 3v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 7l12-4 2 4M17 14h.01"/></svg>',
    chi:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h4"/></svg>'
  };
  function emptyHTML(t){
    return `<div class="empty"><div class="e-ic">${EMPTY_IC[t]}</div>Chưa có khoản ${t}<span>Nhập ở trên hoặc kéo thẻ vào đây</span></div>`;
  }

  function render(opts = {}){
    const first = new Map();
    if (!opts.noFlip) document.querySelectorAll('.list .card').forEach(c => {
      if (c.style.display !== 'none') first.set(c.dataset.id, c.getBoundingClientRect());
    });
    for (const t of ['thu','chi']) {
      const arr = items.filter(i => i.type === t);
      lists[t].innerHTML = arr.length ? arr.map(cardHTML).join('') : emptyHTML(t);
      $('#cnt-'+t).textContent = arr.length;
    }
    document.querySelectorAll('.list .card').forEach(c => {
      const id = c.dataset.id;
      if (id === opts.enter) { c.classList.add('enter'); return; }
      if (id === opts.settle) { c.classList.add('settle'); return; }
      const f = first.get(id); if (!f) return;
      const l = c.getBoundingClientRect(), dx = f.left - l.left, dy = f.top - l.top;
      if (Math.abs(dx) > .5 || Math.abs(dy) > .5)
        c.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}], {duration:380, easing:'cubic-bezier(.2,.8,.2,1)'});
    });
    updateDash();
  }

  /* ---------- Dashboard ---------- */
  function tween(el, to, f){
    const from = el._cur ?? 0;
    cancelAnimationFrame(el._raf);
    if (hidden) { el._cur = to; el.textContent = MASK; return; }
    if (from === to) { el.textContent = f(to); el._cur = to; return; }
    const t0 = performance.now(), d = 650;
    const step = t => {
      const p = Math.min(1, (t - t0) / d), e = 1 - Math.pow(1 - p, 4);
      el._cur = from + (to - from) * e;
      el.textContent = f(el._cur);
      if (p < 1) el._raf = requestAnimationFrame(step); else el._cur = to;
    };
    el._raf = requestAnimationFrame(step);
  }
  const typeOf = (i, ov) => ov && i.id === ov.id ? ov.type : i.type;
  function totals(ov){
    let thu = 0, chi = 0, nt = 0, nc = 0;
    for (const i of items) { const t = typeOf(i, ov); if (t === 'thu') { thu += i.amount; nt++; } else if (t === 'chi') { chi += i.amount; nc++; } }
    return {thu, chi, nt, nc};
  }
  function sparkPath(ov){
    const arr = [...items].sort((a,b) => a.ts - b.ts);
    let s = 0; const pts = [0, ...arr.map(i => { const t = typeOf(i, ov); return s += t === 'thu' ? i.amount : t === 'chi' ? -i.amount : 0; })];
    const W = 200, H = 34, min = Math.min(...pts), max = Math.max(...pts), rng = max - min || 1;
    const P = pts.map((p, k) => [pts.length > 1 ? k / (pts.length - 1) * W : W, H - 3 - (p - min) / rng * (H - 6)]);
    if (P.length < 2) P.unshift([0, P[0][1]]);
    let d = `M${P[0][0].toFixed(1)} ${P[0][1].toFixed(1)}`;
    for (let k = 0; k < P.length - 1; k++) {               // Catmull-Rom → Bézier cho đường mượt
      const p0 = P[k-1] || P[k], p1 = P[k], p2 = P[k+1], p3 = P[k+2] || p2;
      const c1 = [p1[0] + (p2[0]-p0[0])/6, p1[1] + (p2[1]-p0[1])/6], c2 = [p2[0] - (p3[0]-p1[0])/6, p2[1] - (p3[1]-p1[1])/6];
      d += ` C${c1[0].toFixed(1)} ${c1[1].toFixed(1)},${c2[0].toFixed(1)} ${c2[1].toFixed(1)},${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
    }
    return {line:d, area:d + ` L${W} ${H} L0 ${H} Z`, last:pts[pts.length-1]};
  }
  function updateDash(ov){
    const {thu, chi, nt, nc} = totals(ov), bal = thu - chi;
    const balStr = (bal < 0 ? '−' : '') + fmt(Math.abs(bal));
    tween($('#bal'), bal, v => (Math.round(v) < 0 ? '−' : '') + fmt(Math.abs(v)));
    $('#balWrap').classList.toggle('neg', bal < 0);
    $('#balWrap').classList.toggle('long', !hidden && balStr.length > 12);
    tween($('#sumThu'), thu, compact);
    tween($('#sumChi'), chi, compact);
    $('#nThu').textContent = nt + ' khoản';
    $('#nChi').textContent = nc + ' khoản';
    $('#txCount').textContent = (nt + nc) + ' giao dịch';

    const sp = sparkPath(ov);
    $('#spLine').setAttribute('d', sp.line); $('#spArea').setAttribute('d', sp.area);
    $('#spark').classList.toggle('neg', sp.last < 0);

    const C = 2 * Math.PI * 40, tot = thu + chi;
    const ratio = thu ? Math.min(chi / thu, 1) : (chi ? 1 : 0);
    const lc = tot ? ratio * C : 0, lt = tot ? C - lc : 0, gap = (lc > 0 && lt > 0) ? 3 : 0;
    arcChi.style.strokeDasharray = `${Math.max(0, lc - gap)} ${C}`;
    arcThu.style.strokeDasharray = `${Math.max(0, lt - gap)} ${C}`;
    arcThu.style.strokeDashoffset = `${-lc}`;
    const rc = $('#rCenter');
    if (thu) {
      const sv = Math.round((thu - chi) / thu * 100);
      $('#pct').textContent = sv + '%';
      $('#pctLbl').textContent = sv >= 0 ? 'tiết kiệm' : 'vượt chi';
      rc.classList.toggle('neg', sv < 0);
    } else {
      $('#pct').textContent = chi ? '—' : '0%';
      $('#pctLbl').textContent = chi ? 'chưa có thu' : 'tiết kiệm';
      rc.classList.toggle('neg', !!chi);
    }
  }

  /* ---------- Nhập liệu ---------- */
  function setMoney(inp, digits){
    const d = String(digits).replace(/\D/g,'').replace(/^0+/,'').slice(0,13);
    inp.value = d ? Number(d).toLocaleString('vi-VN') : '';
  }
  const bindMoney = inp => inp.addEventListener('input', () => setMoney(inp, inp.value));
  const amtIn = $('#amt'), noteIn = $('#note');
  bindMoney(amtIn); bindMoney($('#eAmt'));
  const shake = el => { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); buzz(30); };

  amtIn.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); noteIn.focus(); } });
  noteIn.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); noteIn.blur(); } });

  const chips = $('#chips');
  chips.addEventListener('pointerdown', e => e.preventDefault()); // giữ bàn phím mở
  chips.addEventListener('click', e => {
    const b = e.target.closest('[data-q]'); if (!b) return;
    const q = b.dataset.q, cur = amtIn.value.replace(/\D/g,'');
    if (q === 'c') amtIn.value = '';
    else if (q === '000') { if (cur) setMoney(amtIn, cur + '000'); }
    else setMoney(amtIn, (parseInt(cur || '0', 10) + parseInt(q, 10)));
    buzz(5);
  });

  document.querySelectorAll('.add').forEach(b => {
    b.addEventListener('pointerdown', e => e.preventDefault());
    b.addEventListener('click', () => addItem(b.dataset.type));
  });

  function addItem(type){
    const amount = parseMoney(amtIn.value);
    if (!amount) { shake($('.entry')); amtIn.focus(); return; }
    const note = noteIn.value.trim() || (type === 'thu' ? 'Khoản thu' : 'Khoản chi');
    const it = {id:uid(), type, amount, note, ts:Date.now()};
    items.unshift(it); save();
    amtIn.value = ''; noteIn.value = '';
    if (document.activeElement) document.activeElement.blur();
    lists[type].scrollTo({top:0, behavior:'smooth'});
    render({enter: it.id});
    buzz(8);
  }

  /* ---------- Sheets ---------- */
  const editSheet = $('#editSheet'), menuSheet = $('#menuSheet'), seg = $('#seg');
  const openSheet = w => { w.classList.add('open'); w.setAttribute('aria-hidden','false'); };
  const closeSheet = w => { w.classList.remove('open'); w.setAttribute('aria-hidden','true'); if (document.activeElement) document.activeElement.blur(); };
  document.querySelectorAll('.scrim').forEach(s => s.addEventListener('click', () => closeSheet(s.parentNode)));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeSheet(editSheet); closeSheet(menuSheet); } });

  let editId = null;
  function openEdit(id){
    const it = items.find(i => i.id === id); if (!it) return;
    editId = id;
    $('#eAmt').value = fmt(it.amount);
    $('#eNote').value = it.note;
    seg.dataset.v = it.type;
    openSheet(editSheet);
  }
  seg.addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (b) { seg.dataset.v = b.dataset.t; buzz(5); } });
  $('#eNote').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('#eSave').click(); } });

  $('#eSave').addEventListener('click', () => {
    const it = items.find(i => i.id === editId); if (!it) return;
    const amount = parseMoney($('#eAmt').value);
    if (!amount) { shake($('#eAmt').parentNode); return; }
    it.amount = amount;
    it.note = $('#eNote').value.trim() || it.note;
    it.type = seg.dataset.v;
    save(); closeSheet(editSheet); render(); toast('Đã cập nhật');
  });

  $('#eDel').addEventListener('click', () => {
    const idx = items.findIndex(i => i.id === editId); if (idx < 0) return;
    const [it] = items.splice(idx, 1); save(); closeSheet(editSheet);
    const el = document.querySelector(`.card[data-id="${it.id}"]`);
    const done = () => { render(); undoToast(it, idx); };
    if (el) el.animate([{opacity:1, transform:'scale(1)'},{opacity:0, transform:'scale(.85)'}], {duration:200, easing:'ease-in', fill:'forwards'}).onfinish = done;
    else done();
  });

  $('#menuBtn').addEventListener('click', () => openSheet(menuSheet));
  $('#mExport').addEventListener('click', () => {
    const rows = [['Loại','Số tiền','Nội dung','Thời gian'], ...items.map(i => [i.type==='thu'?'Thu':'Chi', i.amount, i.note, new Date(i.ts).toLocaleString('vi-VN')])];
    const csv = '﻿' + rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
    const d = new Date(); a.download = `thu-chi-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
    closeSheet(menuSheet); toast('Đã xuất file CSV');
  });
  $('#mClear').addEventListener('click', () => {
    if (!items.length) { closeSheet(menuSheet); return; }
    const backup = items; items = []; save(); closeSheet(menuSheet); render();
    toast('Đã xóa toàn bộ', {label:'Hoàn tác', fn:() => { items = backup; save(); render(); }});
  });

  function undoToast(it, idx){
    toast('Đã xóa thẻ', {label:'Hoàn tác', fn:() => { items.splice(Math.min(idx, items.length), 0, it); save(); render({enter: it.id}); }});
  }

  /* ---------- Toast ---------- */
  const toastEl = $('#toast'); let toastT;
  function toast(msg, action){
    clearTimeout(toastT);
    toastEl.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button type="button">${esc(action.label)}</button>` : '');
    toastEl.classList.toggle('has-act', !!action);
    if (action) toastEl.querySelector('button').onclick = () => { action.fn(); toastEl.classList.remove('show'); };
    requestAnimationFrame(() => toastEl.classList.add('show'));
    toastT = setTimeout(() => toastEl.classList.remove('show'), action ? 4200 : 2000);
  }

  /* ---------- Kéo thả ---------- */
  const cols = $('#cols'), trashHint = $('#trashHint'), trashText = $('#trashText');
  let press = null, drag = null, lock = false;

  function flip(nodes, mutate){
    const m = new Map(nodes.map(n => [n, n.getBoundingClientRect()]));
    mutate();
    nodes.forEach(n => {
      n.getAnimations().forEach(a => a.cancel());
      const a = m.get(n), b = n.getBoundingClientRect(), dx = a.left - b.left, dy = a.top - b.top;
      if (Math.abs(dx) + Math.abs(dy) > .5)
        n.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}], {duration:240, easing:'cubic-bezier(.2,.8,.2,1)'});
    });
  }
  const nextCardOf = el => { let n = el.nextElementSibling; while (n && (n === drag.card || !n.classList.contains('card'))) n = n.nextElementSibling; return n; };
  function cancelPress(){ if (!press) return; clearTimeout(press.timer); press.card.classList.remove('pressing'); press = null; }

  cols.addEventListener('pointerdown', e => {
    if (drag || lock) return;
    const card = e.target.closest('.card');
    if (!card || (e.pointerType === 'mouse' && e.button !== 0)) return;
    press = {card, id:card.dataset.id, x:e.clientX, y:e.clientY, pt:e.pointerType};
    if (e.pointerType !== 'mouse') {
      card.classList.add('pressing');
      press.timer = setTimeout(() => { if (press) startDrag(press.x, press.y); }, 300);
    }
  });
  window.addEventListener('pointermove', e => {
    if (drag) { moveDrag(e.clientX, e.clientY); return; }
    if (!press) return;
    if (Math.hypot(e.clientX - press.x, e.clientY - press.y) > 8) {
      if (press.pt === 'mouse') { startDrag(press.x, press.y); moveDrag(e.clientX, e.clientY); }
      else cancelPress();
    }
  }, {passive:true});
  window.addEventListener('pointerup', () => {
    if (drag) { endDrag(); return; }
    if (press) { const id = press.id; cancelPress(); openEdit(id); }
  });
  window.addEventListener('pointercancel', e => {
    if (drag) { if (e.pointerType === 'mouse') endDrag(); return; }
    cancelPress();
  });
  document.addEventListener('touchmove', e => {
    if (!drag) return;
    e.preventDefault();
    const t = e.touches[0]; moveDrag(t.clientX, t.clientY);
  }, {passive:false});
  document.addEventListener('touchend', () => { if (drag) endDrag(); });
  cols.addEventListener('contextmenu', e => { if (e.target.closest('.card')) e.preventDefault(); });

  function startDrag(x, y){
    const {card, id} = press;
    clearTimeout(press.timer); card.classList.remove('pressing'); press = null;
    const r = card.getBoundingClientRect();
    const ghost = card.cloneNode(true);
    ghost.classList.remove('enter','settle','pressing'); ghost.classList.add('ghost');
    ghost.style.width = r.width + 'px';
    document.body.appendChild(ghost);
    const ph = document.createElement('div'); ph.className = 'ph'; ph.style.height = r.height + 'px';
    card.parentNode.insertBefore(ph, card); card.style.display = 'none';
    const zoneEl = card.closest('.zone'); zoneEl.classList.add('over');
    drag = {id, card, ghost, ph, zoneEl, offX:x - r.left, offY:y - r.top, x, y, out:false, hist:[]};
    document.body.classList.add('dragging');
    buzz(12);
    moveDrag(x, y);
    drag.raf = requestAnimationFrame(autoScroll);
  }

  function moveDrag(x, y){
    if (!drag) return;
    drag.x = x; drag.y = y;
    drag.ghost.style.transform = `translate3d(${x - drag.offX}px,${y - drag.offY}px,0)`;
    drag.hist.push({x, y, t:performance.now()}); if (drag.hist.length > 10) drag.hist.shift();
    // Ra khỏi vùng 2 cột = chế độ xóa
    const out = !insideCols(x, y);
    if (out !== drag.out) {
      drag.out = out;
      drag.ghost.classList.toggle('out', out);
      trashHint.classList.toggle('active', out);
      trashText.textContent = out ? 'Thả tay để xóa' : 'Quẳng ra ngoài để xóa';
      drag.zoneEl.classList.toggle('over', !out);
      updateDash({id:drag.id, type: out ? 'none' : drag.zoneEl.dataset.zone});
      buzz(out ? 18 : 6);
    }
    if (out) return;
    const el = document.elementFromPoint(x, y), z = el && el.closest('.zone');
    if (z && z !== drag.zoneEl) {
      drag.zoneEl.classList.remove('over'); z.classList.add('over'); drag.zoneEl = z;
      const t = z.dataset.zone;
      drag.ghost.dataset.t = t;
      drag.ghost.querySelector('.sign').textContent = t === 'thu' ? '+' : '−';
      updateDash({id:drag.id, type:t}); // dashboard đổi ngay khi kéo sang cột kia
      buzz(6);
    }
    placePh();
  }

  function insideCols(x, y){
    const r = cols.getBoundingClientRect();
    return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
  }
  function velocity(d){
    const now = performance.now(), h = d.hist.filter(p => now - p.t < 120);
    if (h.length < 2) return {x:0, y:0};
    const a = h[0], b = h[h.length - 1], dt = Math.max(16, b.t - a.t);
    return {x:(b.x - a.x) / dt, y:(b.y - a.y) / dt};
  }
  function throwAway(d, v){
    const sp = Math.hypot(v.x, v.y);
    const k = sp > .3 ? 380 : 0;                       // có lực quẳng → bay theo hướng tay; không thì thu nhỏ tại chỗ
    const tx = d.x - d.offX + v.x * k, ty = d.y - d.offY + v.y * k;
    d.ghost.style.transition = 'transform .38s cubic-bezier(.25,.6,.35,1), opacity .38s, scale .38s, rotate .38s';
    d.ghost.style.transform = `translate3d(${tx}px,${ty}px,0)`;
    d.ghost.style.opacity = '0';
    d.ghost.style.scale = k ? '.75' : '.5';
    d.ghost.style.rotate = (v.x >= 0 ? 24 : -24) + 'deg';
    buzz(25);
    setTimeout(() => {
      const idx = items.findIndex(i => i.id === d.id);
      const [it] = items.splice(idx, 1); save();
      d.ghost.remove(); d.ph.remove();
      render(); lock = false;
      undoToast(it, idx);
    }, 330);
  }

  function placePh(){
    const list = drag.zoneEl.querySelector('.list');
    const y = drag.y - list.getBoundingClientRect().top + list.scrollTop;
    const cards = [...list.children].filter(c => c.classList.contains('card') && c !== drag.card);
    let before = null;
    for (const c of cards) { if (y < c.offsetTop + c.offsetHeight / 2) { before = c; break; } }
    if (drag.ph.parentNode === list && nextCardOf(drag.ph) === before) return;
    const affected = [...document.querySelectorAll('.list .card')].filter(c => c !== drag.card);
    flip(affected, () => { before ? list.insertBefore(drag.ph, before) : list.appendChild(drag.ph); });
  }

  function autoScroll(){
    if (!drag) return;
    const list = drag.zoneEl.querySelector('.list'), r = list.getBoundingClientRect();
    let v = 0;
    if (drag.y < r.top + 50) v = -(r.top + 50 - drag.y) / 4;
    else if (drag.y > r.bottom - 50) v = (drag.y - (r.bottom - 50)) / 4;
    if (v && drag.y > r.top - 40 && drag.y < r.bottom + 40) {
      const before = list.scrollTop;
      list.scrollTop += Math.max(-14, Math.min(14, v));
      if (list.scrollTop !== before) placePh();
    }
    drag.raf = requestAnimationFrame(autoScroll);
  }

  function endDrag(){
    const d = drag; drag = null; lock = true;
    cancelAnimationFrame(d.raf);
    document.body.classList.remove('dragging'); d.zoneEl.classList.remove('over');
    trashHint.classList.remove('active'); trashText.textContent = 'Quẳng ra ngoài để xóa';
    // Thả ngoài vùng cột, hoặc hất mạnh mà quỹ đạo bay ra ngoài → xóa
    const v = velocity(d), sp = Math.hypot(v.x, v.y);
    const px = d.x + v.x * 200, py = d.y + v.y * 300, ct = cols.getBoundingClientRect().top;
    const flung = sp > 1.1 && (px < 0 || px > innerWidth || py > innerHeight || py < ct);
    if (d.out || flung) { throwAway(d, v); return; }
    const type = d.zoneEl.dataset.zone;
    let n = d.ph.nextElementSibling;
    while (n && (n === d.card || !n.classList.contains('card'))) n = n.nextElementSibling;
    const nextId = n ? n.dataset.id : null;
    const r = d.ph.getBoundingClientRect();
    d.ghost.style.transition = 'transform .24s cubic-bezier(.2,.8,.2,1), scale .24s, rotate .24s';
    d.ghost.style.transform = `translate3d(${r.left}px,${r.top}px,0)`;
    d.ghost.style.scale = '1'; d.ghost.style.rotate = '0deg';
    setTimeout(() => {
      const idx = items.findIndex(i => i.id === d.id);
      const [it] = items.splice(idx, 1);
      const changed = it.type !== type; it.type = type;
      let at = nextId ? items.findIndex(i => i.id === nextId) : -1;
      if (at < 0) { let last = -1; items.forEach((i, k) => { if (i.type === type) last = k; }); at = last + 1; }
      items.splice(at, 0, it); save();
      render({settle: d.id});
      d.ghost.remove(); lock = false;
      if (changed) toast(type === 'thu' ? 'Đã chuyển sang Thu' : 'Đã chuyển sang Chi');
    }, 240);
  }

  /* ---------- Khởi động ---------- */
  render();
  if (!store.get(SEEN)) { setTimeout(() => toast('Giữ thẻ để kéo · Quẳng ra ngoài để xóa'), 700); store.set(SEEN, '1'); }
})();
</script>
